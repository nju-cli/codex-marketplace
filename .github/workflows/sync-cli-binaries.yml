name: Sync CLI binaries

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: nju-cli release tag to package into this marketplace
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    name: Sync CLI binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          rm -rf dist unpack
          mkdir -p dist unpack
          if [ -z "${RELEASE_TAG}" ]; then
            RELEASE_TAG=$(gh release view --repo nju-cli/nju-cli --json tagName --jq .tagName)
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          gh release download "${RELEASE_TAG}" \
            --repo nju-cli/nju-cli \
            --dir dist \
            --pattern 'nju-cli-linux-x86_64.tar.gz' \
            --pattern 'nju-cli-macos-aarch64.tar.gz' \
            --pattern 'nju-cli-windows-x86_64.zip'

      - name: Unpack into plugin bin directory
        run: |
          rm -rf plugins/nju-cli/bin
          mkdir -p \
            plugins/nju-cli/bin/linux-x86_64 \
            plugins/nju-cli/bin/macos-aarch64 \
            plugins/nju-cli/bin/windows-x86_64

          tar -C plugins/nju-cli/bin/linux-x86_64 -xzf dist/nju-cli-linux-x86_64.tar.gz
          tar -C plugins/nju-cli/bin/macos-aarch64 -xzf dist/nju-cli-macos-aarch64.tar.gz
          unzip -q dist/nju-cli-windows-x86_64.zip -d unpack/windows

          cp unpack/windows/nju-cli.exe plugins/nju-cli/bin/windows-x86_64/nju-cli.exe
          chmod +x \
            plugins/nju-cli/bin/linux-x86_64/nju-cli \
            plugins/nju-cli/bin/macos-aarch64/nju-cli

      - name: Update marketplace manifest versions
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 - <<PY
          import json
          from pathlib import Path

          marketplace_path = Path(".agents/plugins/marketplace.json")
          marketplace = json.loads(marketplace_path.read_text())
          for plugin in marketplace.get("plugins", []):
              if plugin.get("name") == "nju-cli":
                  plugin["version"] = "${VERSION}"
          marketplace_path.write_text(json.dumps(marketplace, indent=2, ensure_ascii=False) + "\n")

          plugin_path = Path("plugins/nju-cli/.codex-plugin/plugin.json")
          plugin_manifest = json.loads(plugin_path.read_text())
          plugin_manifest["version"] = "${VERSION}"
          plugin_path.write_text(json.dumps(plugin_manifest, indent=2, ensure_ascii=False) + "\n")
          PY

      - name: Commit packaged binaries and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/nju-cli/bin .agents/plugins/marketplace.json plugins/nju-cli/.codex-plugin/plugin.json
          git diff --cached --quiet && exit 0
          git commit -m "Package nju-cli ${RELEASE_TAG}"
          git push
