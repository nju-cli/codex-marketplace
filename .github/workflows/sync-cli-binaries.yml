name: Sync CLI binaries

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: nju-cli release tag to package into this marketplace
        required: false
        type: string

permissions:
  contents: write

jobs:
  sync:
    name: Sync CLI binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          rm -rf dist unpack
          mkdir -p dist unpack
          if [ -z "${RELEASE_TAG}" ]; then
            RELEASE_TAG=$(gh release view --repo nju-cli/nju-cli --json tagName --jq .tagName)
          fi
          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"
          gh release download "${RELEASE_TAG}" \
            --repo nju-cli/nju-cli \
            --dir dist \
            --pattern 'nju-cli-linux-x86_64.tar.gz' \
            --pattern 'nju-cli-linux-aarch64.tar.gz' \
            --pattern 'nju-cli-macos-aarch64.tar.gz' \
            --pattern 'nju-cli-windows-x86_64.zip'

      - name: Download source skills
        run: |
          mkdir -p unpack/source
          curl -fsSL \
            -o dist/nju-cli-source.tar.gz \
            "https://codeload.github.com/nju-cli/nju-cli/tar.gz/refs/tags/${RELEASE_TAG}"
          tar -C unpack/source --strip-components=1 -xzf dist/nju-cli-source.tar.gz
          test -d unpack/source/nju-cli-skills

      - name: Unpack into plugin bin directory
        run: |
          rm -rf plugins/nju-cli/bin
          mkdir -p \
            plugins/nju-cli/bin/linux-x86_64 \
            plugins/nju-cli/bin/linux-aarch64 \
            plugins/nju-cli/bin/macos-aarch64 \
            plugins/nju-cli/bin/windows-x86_64

          tar -C plugins/nju-cli/bin/linux-x86_64 -xzf dist/nju-cli-linux-x86_64.tar.gz
          if [ -f dist/nju-cli-linux-aarch64.tar.gz ]; then
            tar -C plugins/nju-cli/bin/linux-aarch64 -xzf dist/nju-cli-linux-aarch64.tar.gz
          fi
          tar -C plugins/nju-cli/bin/macos-aarch64 -xzf dist/nju-cli-macos-aarch64.tar.gz
          unzip -q dist/nju-cli-windows-x86_64.zip -d unpack/windows

          cp unpack/windows/nju-cli.exe plugins/nju-cli/bin/windows-x86_64/nju-cli.exe
          chmod +x \
            plugins/nju-cli/bin/linux-x86_64/nju-cli \
            plugins/nju-cli/bin/macos-aarch64/nju-cli
          if [ -f plugins/nju-cli/bin/linux-aarch64/nju-cli ]; then
            chmod +x plugins/nju-cli/bin/linux-aarch64/nju-cli
          fi

      - name: Update skill contents
        run: |
          rm -rf plugins/nju-cli/skills/nju-cli
          mkdir -p plugins/nju-cli/skills
          cp -R unpack/source/nju-cli-skills plugins/nju-cli/skills/nju-cli

      - name: Update marketplace manifest versions
        run: |
          VERSION="${RELEASE_TAG#v}"
          python3 - <<PY
          import json
          import re
          from pathlib import Path

          marketplace_path = Path(".agents/plugins/marketplace.json")
          marketplace = json.loads(marketplace_path.read_text())
          for plugin in marketplace.get("plugins", []):
              if plugin.get("name") == "nju-cli":
                  plugin["version"] = "${VERSION}"
          marketplace_path.write_text(json.dumps(marketplace, indent=2, ensure_ascii=False) + "\n")

          plugin_path = Path("plugins/nju-cli/.codex-plugin/plugin.json")
          plugin_manifest = json.loads(plugin_path.read_text())
          plugin_manifest["version"] = "${VERSION}"
          plugin_path.write_text(json.dumps(plugin_manifest, indent=2, ensure_ascii=False) + "\n")

          for script_path in [Path("plugins/nju-cli/scripts/nju-cli"), Path("plugins/nju-cli/scripts/nju-cli.ps1")]:
              text = script_path.read_text()
              text = re.sub(r'release_tag="v[^"]+"', 'release_tag="${RELEASE_TAG}"', text)
              text = re.sub(r'\$ReleaseTag = "v[^"]+"', '$ReleaseTag = "${RELEASE_TAG}"', text)
              script_path.write_text(text)
          PY

      - name: Update binary checksums
        run: |
          {
            sha256sum plugins/nju-cli/bin/linux-x86_64/nju-cli | awk '{print $1 " linux-x86_64 nju-cli"}'
            if [ -f plugins/nju-cli/bin/linux-aarch64/nju-cli ]; then
              sha256sum plugins/nju-cli/bin/linux-aarch64/nju-cli | awk '{print $1 " linux-aarch64 nju-cli"}'
            fi
            sha256sum plugins/nju-cli/bin/macos-aarch64/nju-cli | awk '{print $1 " macos-aarch64 nju-cli"}'
            sha256sum plugins/nju-cli/bin/windows-x86_64/nju-cli.exe | awk '{print $1 " windows-x86_64 nju-cli.exe"}'
          } > plugins/nju-cli/scripts/nju-cli.sha256

      - name: Commit packaged binaries, skills, and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/nju-cli/bin plugins/nju-cli/scripts plugins/nju-cli/skills/nju-cli .agents/plugins/marketplace.json plugins/nju-cli/.codex-plugin/plugin.json
          git diff --cached --quiet && exit 0
          git commit -m "Package nju-cli ${RELEASE_TAG}"
          git push
